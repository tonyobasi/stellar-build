server {
    listen 80;
    listen [::]:80;
    server_name stellar.saference.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stellar.saference.com;

    # If Certbot is used on the VPS, it will usually manage these paths.
    ssl_certificate /etc/letsencrypt/live/stellar.saference.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellar.saference.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
